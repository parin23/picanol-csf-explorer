<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>CSF Explorer — self test</title>
<style>
  body { background: #0d1117; color: #e2e8f0; font: 14px/1.6 ui-monospace, monospace; padding: 2rem; }
  .pass { color: #10b981; } .fail { color: #ef4444; } h1 { font-size: 1.1rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>CSF Explorer — self test</h1>
<pre id="out"></pre>

<script src="js/decode.js"></script>
<script src="js/model.js"></script>
<script>
const out = document.getElementById('out');
let failed = 0;
function check(name, cond, got) {
  const ok = !!cond;
  if (!ok) failed++;
  out.innerHTML += `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span>  ${name}` +
    (ok ? '' : `  → got: ${got}`) + '\n';
}

// ── export XML ──
const xml = `<production>
<data date="2026/09/29" time="05:13:24" serial="453844" shift="B" absolute_picks="176498478" absolute_length="49822.73" type="start" subtype1="start"/>
<data date="2026/09/29" time="05:13:37" serial="453844" shift="B" absolute_picks="176498565" absolute_length="49822.74" type="stop" subtype1="filling" subtype2="FD left gripper" channel="8" mssg_nr="60918" picks="87"/>
<data date="2026/09/29" time="08:00:00" serial="453844" shift="A" absolute_picks="176528038" absolute_length="49829.53" type="shift" subtype1="A"/>
</production>`;
const ev = [];
Decode.exportXml(xml, ev);
check('export: 3 events', ev.length === 3, ev.length);
check('export: start parsed', ev[0].kind === 'start' && ev[0].picks === 176498478, JSON.stringify(ev[0]));
check('export: stop reason label', ev[1].label === 'FD left gripper' && ev[1].mssg === 60918, JSON.stringify(ev[1]));
check('export: stop since-picks', ev[1].sincePicks === 87, ev[1].sincePicks);
check('export: timestamp normalised', ev[0].t === '2026-09-29T05:13:24', ev[0].t);
check('export: shift event', ev[2].kind === 'shift' && ev[2].title === 'A', JSON.stringify(ev[2]));

// ── text log: operator, article, pick variation grouping ──
const L = 'D;1;info;';
const log = [
  L + '2026-09-29T05:00:00.000;StyleFile.ActivateNewProdMonArticle.execute;Starting new production monitoring article: NS-1400-36-82.EP',
  L + '2026-09-29T05:00:10.000;Communication.RC90Poller.Poller.onModifyRequest;1: Request to change VGS_ID_PICK_DENSITY_PER_METER - 0 - 0 of type float to 1417.3228759765625',
  L + '2026-09-29T05:00:20.000;Communication.RC90Poller.Poller.onModifyRequest;1: Request to change VGS_ID_PICK_DENSITY_PER_METER - 0 - 0 of type float to 3228.346435546875',
  L + '2026-09-29T06:00:00.000;Communication.RC90Poller.Poller.onModifyRequest;1: Request to change VGS_ID_PICK_DENSITY_PER_METER - 0 - 0 of type float to 1968.50390625',
  L + '2026-09-29T07:00:00.000;Auth.onLogin;Logged in with session key: {abc-123}, userId: 42',
].join('\n');
const ev2 = [];
Decode.textLog(log, ev2, 'test');
const pick = ev2.filter(e => e.kind === 'pick');
check('log: article captured', ev2.some(e => e.kind === 'articleLog' && e.detail === 'NS-1400-36-82.EP'), JSON.stringify(ev2));
check('log: two densities grouped (36+82)', pick.length === 2 && pick[0].values.length === 2, JSON.stringify(pick));
check('log: 1417 -> 36 picks/inch', Math.round(pick[0].values[0] / 39.37) === 36, pick[0].values[0]);
check('log: 3228 -> 82 picks/inch', Math.round(pick[0].values[1] / 39.37) === 82, pick[0].values[1]);
check('log: far-apart density split', pick[1].values.length === 1, JSON.stringify(pick[1]));
check('log: operator login', ev2.some(e => e.kind === 'operator' && e.title === 'Operator Logged In'), '');

// ── btf: framing + big-endian reason code + clock ──
function record(type, clock, code) {
  const r = new Uint8Array(48);
  r.set([0x03, 0x00, 0x01, type], 0);
  new DataView(r.buffer).setUint32(4, clock);              // big-endian clock
  new DataView(r.buffer).setUint16(38, code);              // big-endian mssg_nr
  return r;
}
const bytes = new Uint8Array(96);
bytes.set(record(0x93, 0x8cd74631, 60918), 0);
bytes.set(record(0x93, 0x8cd74632, 50207), 48);
const raw = Decode.btfStartstopRaw([bytes]);
check('btf: two records decoded', raw.length === 2, JSON.stringify(raw));
check('btf: clock big-endian', raw[0].clock === 0x8cd74631, raw[0].clock && raw[0].clock.toString(16));
check('btf: reason code big-endian', raw[0].code === 60918 && raw[1].code === 50207, JSON.stringify(raw.map(r => r.code)));
const solved = Decode.btfToEvents(raw, Date.parse('2026-09-29T00:00:00Z') / 1000, Date.parse('2026-09-30T00:00:00Z') / 1000);
check('btf: clock resolves inside the known span', solved.events.length === 2, solved.events.length);

// ── model: efficiency, picks, downtime by reason ──
const m = Model.build([
  { t: '2026-09-29T08:00:00', kind: 'shift', title: 'A', src: 'export' },
  { t: '2026-09-29T08:00:00', kind: 'start', picks: 1000, length: 100, src: 'export' },
  { t: '2026-09-29T09:00:00', kind: 'stop', picks: 2000, length: 120, mssg: 60918, label: 'FD left gripper', src: 'export' },
  { t: '2026-09-29T09:30:00', kind: 'start', picks: 2000, length: 120, src: 'export' },
  { t: '2026-09-29T10:00:00', kind: 'stop', picks: 2600, length: 150, mssg: 50207, label: 'Manual stop', src: 'export' },
]);
check('model: events sorted', m.events.length === 5, m.events.length);
check('model: picks counted', m.picks === 1600, m.picks);
check('model: metres counted', m.metres === 50, m.metres);
check('model: two stops', m.stopCount === 2, m.stopCount);
check('model: downtime by reason', m.byReason.length === 2 && m.byReason[0].sec === 1800, JSON.stringify(m.byReason));
check('model: efficiency 75%', Math.abs(m.efficiency - 0.75) < 1e-9, m.efficiency);
check('model: article list empty', m.articles.length === 0, m.articles.length);

// ── model: binary stops duplicated by the export are dropped ──
const dup = Model.build([
  { t: '2026-09-29T08:00:00', kind: 'start', picks: 0, length: 0, src: 'export' },
  { t: '2026-09-29T08:10:00', kind: 'stop', picks: 100, length: 10, mssg: 50967, label: 'Bobbin', src: 'export' },
  { t: '2026-09-29T08:10:02', kind: 'stop', picks: 0, length: 0, mssg: 50967, label: 'Bobbin', src: 'btf' },
]);
check('model: duplicate binary stop dropped', dup.stopCount === 1, dup.stopCount);

// ── pattern records: the Jacquard design index tables ──
const patternXml = `<?xml version="1.0"?><machine><style><design name="Navsutra mc 9">
 <config><jacquard>TRUE</jacquard><patternCount>2</patternCount><patternList>Color,PickDensity</patternList>
 <selections><selection>0,1</selection></selections></config>
 <patterns><pattern type="Color"><attribs><source>External</source></attribs></pattern>
 <pattern type="PickDensity"><attribs><source>External</source></attribs></pattern></patterns>
 <indexTables><table type="Color"><nrOfLines>2</nrOfLines><data>1,0</data></table>
 <table type="PickDensity"><nrOfLines>2</nrOfLines><data>36.00,82.00</data>
 <attribs><indexUnit>Picks/Inch</indexUnit></attribs></table></indexTables></design></style></machine>`;
const design = Decode.patternDesign(new TextEncoder().encode(patternXml));
check('pattern: design name', design && design.design === 'Navsutra mc 9', design && design.design);
check('pattern: jacquard flag', design && design.jacquard === true, design && design.jacquard);
const pd = design.tables.find(t => t.type === 'PickDensity');
check('pattern: two densities 36 + 82', pd.values.join(',') === '36,82', pd.values);
check('pattern: unit is Picks/Inch', pd.unit === 'Picks/Inch', pd.unit);
check('pattern: nrOfLines read', pd.lines === 2, pd.lines);
const many = Decode.patternDesign(new TextEncoder().encode(patternXml.replace('36.00,82.00', '30.00,36.00,50.00,82.00').replace('<nrOfLines>2</nrOfLines><data>36', '<nrOfLines>4</nrOfLines><data>30')));
const manyPd = many.tables.find(t => t.type === 'PickDensity');
check('pattern: four densities supported', manyPd.values.length === 4, manyPd.values);

// ── kernel log + memory trace ──
const kern = Decode.kernelLog([
  'random noise',
  'Jan  1 10:00:01 host kernel: Oops: 0002 [#1] SMP PTI',
  'Jan  1 10:00:02 host kernel: Out of memory: Killed process 1234',
  'Jan  1 10:00:03 host kernel: thermal throttled',
].join('\n'), 'kernel');
check('kernel: three notable lines', kern.length === 3, kern.length);
check('kernel: kernel fault labelled', kern[0].title === 'Kernel fault', kern[0] && kern[0].title);
check('kernel: OOM labelled', kern[1].title === 'Out of memory', kern[1] && kern[1].title);
const mem = Decode.memoryTrace('Date;Total;Free;Available\n2026-01-01 00:00:00;8000000;2000000;2100000\n2026-01-01 00:01:00;8000000;1900000;1950000\n');
check('memory: samples parsed', mem && mem.samples === 2, mem && mem.samples);
check('memory: peak used computed', mem && Math.abs(mem.maxUsed - 75.625) < 0.01, mem && mem.maxUsed);

// ── model: feeders, hourly buckets, design sets ──
const fed = Model.build([
  { t: '2026-09-29T08:00:00', kind: 'start', picks: 0, length: 0, src: 'export' },
  { t: '2026-09-29T08:05:00', kind: 'stop', picks: 500, length: 10, mssg: 60918, channel: '8', label: 'FD left gripper', sincePicks: 500, src: 'export' },
  { t: '2026-09-29T08:20:00', kind: 'start', picks: 500, length: 10, src: 'export' },
  { t: '2026-09-29T08:25:00', kind: 'stop', picks: 700, length: 14, mssg: 60917, channel: '3', label: 'FD not taken', sincePicks: 200, src: 'export' },
], [{ design: 'Navsutra mc 9', jacquard: true, tables: [{ type: 'PickDensity', unit: 'Picks/Inch', lines: 2, values: [36, 82] }] }]);
check('model: feeders grouped by channel', fed.feeders.length === 2, fed.feeders.length);
check('model: feeder stop count', fed.feeders.find(f => f.channel === '8').stops === 1, JSON.stringify(fed.feeders));
check('model: feeder downtime = gap to next start', Math.round(fed.feeders.find(f => f.channel === '8').sec) === 900, fed.feeders.find(f => f.channel === '8').sec);
check('model: hourly buckets produced', fed.hourly.length === 1, fed.hourly.length);
check('model: hourly efficiency between 0 and 1', fed.hourly[0].efficiency > 0 && fed.hourly[0].efficiency < 1, fed.hourly[0].efficiency);
check('model: design density set decoded', fed.designs.length === 1 && fed.designs[0].densities.join(',') === '36,82', JSON.stringify(fed.designs));

// ── resilience: nothing here may throw, whatever it is handed ──
for (const junk of [null, undefined, '', 'not xml', '<data/>', '<data type="stop"/>', 42, {}, []]) {
  let threw = null;
  try {
    const out = [];
    Decode.exportXml(junk, out);
    Decode.textLog(junk, out, 'x');
    Decode.kernelLog(junk, 'x');
    Decode.memoryTrace(junk);
    Decode.machineDesc(junk); Decode.terminalDesc(junk); Decode.spareParts(junk); Decode.shiftRegimes(junk);
    Decode.manifest(junk);
    Decode.patternDesign(junk === null || junk === undefined ? junk : new TextEncoder().encode(String(junk)));
    Decode.btfRecords(ArrayBuffer.isView(junk) ? junk : new Uint8Array(8));
    Decode.btfStartstopRaw([junk].filter(x => x && x.length));
    Decode.btfToEvents([], 0, 0);
  } catch (e) { threw = e.message; }
  check('junk input handled: ' + JSON.stringify(junk), !threw, threw);
}
const junkEvents = [null, undefined, 42, 'x', {}, {t:'not-a-date'}, {t:'2026-09-29T08:00:00'},
  {t:'2026-09-29T08:00:00', kind:'stop'}, {t:'2026-09-29T08:00:00', kind:'pick', values:null},
  {t:'2026-09-29T08:00:00', kind:'yarn', channels:null}, {t:'2026-09-29T08:00:00', kind:'article', title:null}];
let junkThrew = null, junkModel = null;
try { junkModel = Model.build(junkEvents, [null, {}, {design:'d'}, {design:'d', tables:[null]}], { shifts: ['A'], from: 'x', to: 'y' }); }
catch (e) { junkThrew = e.message; }
check('model: junk events and designs never throw', !junkThrew, junkThrew);
check('model: junk run still returns a complete shape',
  !!(junkModel && Array.isArray(junkModel.events) && junkModel.byReason && junkModel.feeders &&
     junkModel.hourly && junkModel.stats && junkModel.shiftTotals && junkModel.gantt && junkModel.designs), '');

// A very large archive must not blow the stack or the clock.
let bigThrew = null, bigModel = null;
try {
  const big = [];
  for (let i = 0; i < 200000; i++) big.push({ t: `2026-09-29T${String(i % 24).padStart(2,'0')}:${String(i % 60).padStart(2,'0')}:${String(i % 60).padStart(2,'0')}`,
    kind: i % 2 ? 'stop' : 'start', picks: i, length: i / 10, shift: 'A', src: 'export', mssg: 60918, label: 'X', channel: '8' });
  bigModel = Model.build(big, []);
} catch (e) { bigThrew = e.message; }
check('model: 200k events build without overflowing', !bigThrew && !!(bigModel && bigModel.stopCount > 0), bigThrew);
check('model: a fragmented day is capped, not exploded',
  !!(bigModel && bigModel.gantt[0].segs.length <= 400), bigModel && bigModel.gantt[0].segs.length);

// ── range-aware model and the analytics built on it ──
// A consistent archive: the lifetime counter advances by exactly what each run
// weaves, so additive totals and counter totals must agree.
const day = n => `2026-09-${String(n).padStart(2, '0')}`;
const base = [];
let cum = 0;
for (let d = 10; d <= 20; d++) {
  const a = 10 * d, b = 2 * d;
  base.push({ t: `${day(d)}T08:00:00`, kind: 'start', picks: cum, length: cum / 100, shift: 'A', src: 'export' });
  base.push({ t: `${day(d)}T09:00:00`, kind: 'stop', picks: cum + a, length: (cum + a) / 100, shift: 'A', sincePicks: a, mssg: 60918, channel: '8', label: 'FD left gripper', src: 'export' });
  base.push({ t: `${day(d)}T10:00:00`, kind: 'start', picks: cum + a, length: (cum + a) / 100, shift: 'B', src: 'export' });
  base.push({ t: `${day(d)}T12:00:00`, kind: 'stop', picks: cum + a + b, length: (cum + a + b) / 100, shift: 'B', sincePicks: b, mssg: 50207, label: 'Manual stop', src: 'export' });
  cum += a + b;
}
const full = Model.build(base, []);
check('range: full span keeps every stop', full.stopCount === 22, full.stopCount);
check('range: heatmap cells total the stops', full.hourMatrix.hours.reduce((s, h) => s + h.stops, 0) === full.stopCount,
  full.hourMatrix.hours.reduce((s, h) => s + h.stops, 0));
check('range: feeder matrix has the same reason list as the heatmap',
  full.feederMatrix.reasons.join(',') === full.hourMatrix.reasons.join(','),
  full.feederMatrix.reasons.join(',') + ' vs ' + full.hourMatrix.reasons.join(','));
const fmCells = full.feederMatrix.channels.reduce((s, ch) =>
  s + full.feederMatrix.reasons.reduce((x, r) => x + full.feederMatrix.cell(ch, r), 0), 0);
check('range: feeder matrix totals the channel stops', fmCells === 11, fmCells);
check('range: histogram totals the stops', full.histogram.reduce((s, h) => s + h.count, 0) === full.stopCount,
  full.histogram.reduce((s, h) => s + h.count, 0));
check('range: pareto cumulative ends at 100%', Math.abs(full.byReason[full.byReason.length - 1].cumulative - 1) < 1e-9,
  full.byReason[full.byReason.length - 1].cumulative);
check('range: pareto is sorted by downtime', full.byReason.every((r, i) => i === 0 || full.byReason[i - 1].sec >= r.sec), '');
check('range: MTTR equals the mean of the stop durations', Math.abs(full.stats.mttr - 34527.272727272727) < 1e-6, full.stats.mttr);
check('range: longest stop is the overnight gap', Math.abs(full.stats.longestStop.sec - 72000) < 1e-6, full.stats.longestStop.sec);
check('range: histogram buckets long stops together', full.histogram[5].count === 21, full.histogram[5].count);
check('range: the unclosed final stop lands in the first bucket', full.histogram[0].count === 1, full.histogram[0].count);
check('range: MTBF is running time over stop gaps', full.stats.mtbf > 0 && full.stats.mtbr === undefined, full.stats.mtbf);
check('range: weekday buckets cover seven days', full.weekday.length === 7, full.weekday.length);
check('range: feeder matrix totals channel stops', full.feeders.reduce((s, f) => s + f.stops, 0) === 11, full.feeders.reduce((s, f) => s + f.stops, 0));
check('range: warp panel counts beam stops', full.warp.beam === 0 && full.warp.other === 0, JSON.stringify(full.warp));
check('range: gantt has one row per active day', full.gantt.length === 11, full.gantt.length);
check('range: shift totals split picks without double counting',
  full.shiftTotals.reduce((a, s) => a + s.picks, 0) === full.days.reduce((a, d) => a + d.picks, 0),
  full.shiftTotals.reduce((a, s) => a + s.picks, 0) + ' vs ' + full.days.reduce((a, d) => a + d.picks, 0));
check('range: additive totals match the lifetime counter', full.picks === full.days.reduce((a, d) => a + d.picks, 0),
  full.picks + ' vs ' + full.days.reduce((a, d) => a + d.picks, 0));

const part = Model.build(base, [], { from: day(12), to: day(14) });
check('range: filtering narrows the stop count', part.stopCount === 6, part.stopCount);
check('range: filtering narrows the days', part.days.length === 3, part.days.length);
check('range: boundaries are inclusive', part.first.startsWith(day(12)) && part.last.startsWith(day(14)),
  part.first + ' .. ' + part.last);
check('range: an empty range is survivable', Model.build(base, [], { from: day(1), to: day(2) }).stopCount === 0, '');

// ── shift filtering ──
const onlyA = Model.build(base, [], { shifts: ['A'] });
const onlyB = Model.build(base, [], { shifts: ['B'] });
check('shifts: filtering to one shift drops the other', onlyA.stopCount === 11 && onlyB.stopCount === 11,
  onlyA.stopCount + '/' + onlyB.stopCount);
check('shifts: unfiltered run keeps both shifts', Model.build(base, [], { shifts: [] }).stopCount === 22, '');
check('shifts: filtering preserves the shift attribution',
  onlyA.shiftTotals.length === 1 && onlyA.shiftTotals[0].name === 'A' &&
  onlyA.shiftTotals[0].picks === full.shiftTotals.find(s => s.name === 'A').picks,
  onlyA.shiftTotals[0] && onlyA.shiftTotals[0].picks + ' vs ' + (full.shiftTotals.find(s => s.name === 'A') || {}).picks);
check('shifts: the two shifts together account for every pick',
  full.shiftTotals.reduce((a, s) => a + s.picks, 0) === full.picks,
  full.shiftTotals.reduce((a, s) => a + s.picks, 0) + ' vs ' + full.picks);
check('shifts: every surviving event belongs to the chosen shift',
  onlyA.events.every(e => e.shift === 'A'), '');
check('shifts: the two shifts are disjoint', onlyA.picks === 0 || onlyB.picks === 0 || onlyA.picks !== onlyB.picks, '');
const both = Model.build(base, [], { shifts: ['A', 'B'] });
check('shifts: selecting both matches no filter', both.stopCount === full.stopCount, both.stopCount);

// ── Indian date format: DD/MM/YYYY on a 24-hour clock ──
const sample = '2026-09-29T16:22:11';
check('date: DD/MM/YYYY', Decode.fmtDate(sample) === '29/09/2026', Decode.fmtDate(sample));
check('time: 24-hour with seconds', Decode.fmtTime(sample) === '16:22:11', Decode.fmtTime(sample));
check('datetime: date and clock', Decode.fmtDateTime(sample) === '29/09/2026 16:22', Decode.fmtDateTime(sample));
check('day short: DD/MM', Decode.fmtDayShort('2026-01-05') === '05/01', Decode.fmtDayShort('2026-01-05'));
check('day full: DD/MM/YYYY', Decode.fmtDayFull('2026-01-05') === '05/01/2026', Decode.fmtDayFull('2026-01-05'));
check('day label: weekday then DD/MM/YYYY', Decode.fmtDayLabel('2026-09-29') === 'Tuesday, 29/09/2026', Decode.fmtDayLabel('2026-09-29'));
check('format: single-digit days and months are padded', Decode.fmtDate('2026-01-05T00:00:00') === '05/01/2026', Decode.fmtDate('2026-01-05T00:00:00'));
check('format: midnight shows 24-hour zero', Decode.fmtClock('2026-01-05T00:07:00') === '00:07', Decode.fmtClock('2026-01-05T00:07:00'));
check('format: afternoon hours are not 12-hour', Decode.fmtClock('2026-01-05T16:07:00') === '16:07', Decode.fmtClock('2026-01-05T16:07:00'));
check('format: invalid input degrades quietly', Decode.fmtDate('nonsense') === '—' && Decode.fmtDayFull('nonsense') === 'nonsense',
  Decode.fmtDate('nonsense') + '/' + Decode.fmtDayFull('nonsense'));
const isoOut = [];
Decode.exportXml('<data date="2026/09/29" time="16:22:11" absolute_picks="5" type="stop" mssg_nr="50967"/>', isoOut);
check('format: internals stay ISO so sorting still works', isoOut[0].t === '2026-09-29T16:22:11' && Decode.fmtDateTime(isoOut[0].t) === '29/09/2026 16:22',
  isoOut[0] && isoOut[0].t);
// A DD/MM string must never be mistaken for a US M/D/Y reading of the same digits.
check('format: day comes before month, always', Decode.fmtDate('2026-09-29') === '29/09/2026' && Decode.fmtDate('2026-03-29') === '29/03/2026',
  Decode.fmtDate('2026-09-29') + ' / ' + Decode.fmtDate('2026-03-29'));
check('format: single-digit days are zero-padded', Decode.fmtDate('2026-09-01') === '01/09/2026', Decode.fmtDate('2026-09-01'));
check('format: export XML dates convert too', Decode.fmtDateTime(isoOut[0].t).slice(0, 10) === '29/09/2026', Decode.fmtDateTime(isoOut[0].t));

out.innerHTML += `\n<span class="${failed ? 'fail' : 'pass'}">${failed ? failed + ' FAILED' : 'ALL PASSED'}</span>\n`;
</script>
</body>
</html>
