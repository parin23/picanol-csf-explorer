<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picanol CSF Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="logo">Picanol <span>/</span> CSF Explorer</div>
  <div id="range" class="range"></div>
  <div class="spacer"></div>
  <nav id="tabs"></nav>
  <button id="export" class="ghost" disabled onclick="UI.exportCsv()" title="Export events as CSV (events include every decoded source)">⬇ CSV</button>
  <button id="theme" class="ghost" onclick="toggleTheme()" title="Toggle theme (t)"><span id="theme-icon">☀️</span></button>
</header>

<main>
  <aside>
    <label id="drop" class="drop">
      <input type="file" id="file" accept=".zip" hidden>
      <span class="drop-icon">📦</span>
      <b>Drop a CSF zip</b>
      <small>or click to browse — everything is decoded in your browser</small>
    </label>
    <div id="progress" style="display:none">
      <div id="progress-label">Working…</div>
      <div class="track"><i id="progress-bar"></i></div>
    </div>
    <input id="search" class="search" placeholder="Filter events…" oninput="UI.searchInput(this.value)">
    <div id="filters" class="filters"></div>
    <div id="loaded" class="loaded"></div>
    <div id="stats" class="stats" style="display:none"></div>
  </aside>

  <section id="empty" class="empty">
    <div class="big">🏭</div>
    <h2>No CSF loaded</h2>
    <p id="empty-detail">Open a Picanol CSF archive to read its production export, operator actions,
    machine settings and binary stop history.</p>
  </section>

  <div id="view-timeline" class="view"></div>
  <div id="view-production" class="view"></div>
  <div id="view-machine" class="view"></div>
  <div id="view-diagnostics" class="view"></div>
</main>

<script src="js/decode.js"></script>
<script src="js/csf.js"></script>
<script src="js/model.js"></script>
<script src="js/ui.js"></script>
<script>
// theme
const themeIcon = () => { document.getElementById('theme-icon').textContent =
  document.documentElement.dataset.theme === 'light' ? '☀️' : '🌙'; };
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  localStorage.theme = t;
  themeIcon();
}
document.documentElement.dataset.theme = localStorage.theme || 'light';
themeIcon();

// file input + drag and drop
const drop = document.getElementById('drop');
drop.onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => e.target.files[0] && UI.loadFile(e.target.files[0]);
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
document.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) UI.loadFile(f);
});

// keyboard: 1-4 switch tabs, / focuses search, t toggles theme
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  const tabs = { 1: 'timeline', 2: 'production', 3: 'machine', 4: 'diagnostics' };
  if (tabs[e.key]) UI.setTab(tabs[e.key]);
  else if (e.key === '/') { e.preventDefault(); UI.setTab('timeline'); document.getElementById('search').focus(); }
  else if (e.key === 't') toggleTheme();
});
</script>
</body>
</html>
